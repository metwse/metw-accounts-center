[package]
name = "service"
version = "0.0.0"
edition = "2024"
build = "build/main.rs"

[dependencies]
metw-id = { workspace = true }

tokio = { workspace = true, features = ["rt", "macros", "sync"] }
async-trait = { workspace = true }

utoipa = { workspace = true, features = ["axum_extras"] }

sqlx = { workspace = true, features = ["chrono", "postgres"]}
chrono = { workspace = true }
redis = { workspace = true }

tracing = { workspace = true }

pastey = { workspace = true }
dotenvy = { workspace = true }
thiserror = { workspace = true }

validator = { workspace = true, features = ["derive"] }
regex = { workspace = true }

serde = { workspace = true }
serde_with = { workspace = true}
serde_json = { workspace = true }
serde_variant = { workspace = true }

# for client secret generation
rand = "0.10"
sha2 = "0.11"

# encryption/signature utility
biscuit = "0.8"
argon2 = "0.5"
# transitive dependency: argon2::password_hash::rand_core::OsRng requires this
# feature
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

test-log = { workspace = true, features = ["trace"] }

futures-util = { workspace = true }

service = { path = ".", features = ["mock"] }

[build-dependencies]
# email templates
toml = { version = "1", features = ["parse", "serde"], optional = true }
strfmt = { version = "0.2", optional = true }
minify-html = { version = "0.18", optional = true }


[features]
# tokio/time requred for time outs in mock token service.
mock = ["tokio/time"]
testutil = []
email-templates = ["dep:toml", "dep:strfmt", "dep:minify-html"]

[lints]
workspace = true
